<!DOCTYPE html>
<html>

<head>

    <title>PaperMind AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>
Results for:
<strong>{{ query }}</strong>
</h2>

<hr>

{% for paper in papers %}

<div class="card mb-4">

<div class="card-body">

<h4>{{ paper.title }}</h4>

<p>

<b>Authors:</b>

{{ paper.authors }}

</p>

<p>

<b>Year:</b>

{{ paper.year }}

</p>

<p>

<b>Citations:</b>

{{ paper.citations }}

</p>

<p>

<b>Similarity:</b>

{{ paper.similarity }}%

</p>

<a
href="{{ paper.doi }}"
target="_blank"
class="btn btn-primary">

View Paper

</a>

</div>

</div>

{% endfor %}

</div>

</body>

</html>
